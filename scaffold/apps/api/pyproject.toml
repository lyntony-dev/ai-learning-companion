[project]
name = "ai-agent-course-tutor-api"
version = "0.1.0"
description = "FastAPI backend for the AI Agent course tutor MVP."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "sqlmodel>=0.0.21",
  "pyyaml>=6.0",
  "beautifulsoup4>=4.12.0",
  "pypdf>=4.0.0",
  "chromadb>=0.5.0",
  "httpx>=0.27.0",
  "langgraph>=1.0.0",
  "langgraph-checkpoint-sqlite>=2.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0"
]
# 本地免费向量模型(EMBEDDING_PROVIDER=local),不需要任何 API key,离线跑
local-embedding = [
  "sentence-transformers>=3.0.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
