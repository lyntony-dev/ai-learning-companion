# AI Agent 学习伙伴 —— 生产/演示部署编排(前端 nginx 同源反代后端)
#
#   cp deploy/.env.deploy.example deploy/.env.deploy   # 填 Ark key + 生产密钥
#   docker compose up --build
#   浏览器打开 http://localhost:8080
#
# 架构:web(nginx) 同源反代 /api → api(uvicorn:8000),因此默认无需 CORS。
# 若前后端分离到不同域,再给 api 设 CORS_ALLOW_ORIGINS(见 ADR-0010)。
services:
  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    env_file:
      - deploy/.env.deploy
    volumes:
      # 业务库 + 向量索引持久化(容器重建不丢学习数据)
      - tutor-data:/app/scaffold/apps/api/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tutor-data:
